plugins {
    id "com.android.application"
}

android {
    namespace "com.agentreach.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.agentreach.mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "android.app.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The shipped app is dependency-free; JUnit is used only by local JVM tests.
    testImplementation "junit:junit:4.13.2"
}
